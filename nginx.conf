# One worker is plenty for a static site and keeps memory at a few MB.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 256;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  # Writable paths for the non-root user.
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  access_log /dev/stdout;
  sendfile on;
  server_tokens off;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml text/plain;

  server {
    listen 3000;
    root /usr/share/nginx/html;

    # TLS ends at Traefik; keep redirects relative so they stay on https.
    absolute_redirect off;

    error_page 404 /404.html;

    location / {
      try_files $uri $uri.html $uri/ =404;
      add_header Cache-Control "no-cache";
    }

    # Content-hashed build output never changes under the same name.
    location /_next/static/ {
      add_header Cache-Control "public, max-age=31536000, immutable";
    }
  }
}
